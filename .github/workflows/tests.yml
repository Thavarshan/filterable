name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pdo_sqlite, bcmath, intl
          coverage: none
      - run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - run: composer update --prefer-stable --prefer-dist --no-interaction --with-all-dependencies
      - run: composer test

  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, bcmath, intl
          coverage: none
      - run: composer require 'laravel/framework:^11.0' 'orchestra/testbench:^9.0' --no-update --no-interaction
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --with-all-dependencies
      - run: composer test

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: test_filterable
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      mysql_peer:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: test_filterable
        ports: ['3307:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test_filterable
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, bcmath, intl
          coverage: none
      - run: composer require 'laravel/framework:^13.0' 'orchestra/testbench:^11.0' --no-update --no-interaction
      - run: composer update --prefer-stable --prefer-dist --no-interaction --with-all-dependencies
      - run: composer test -- --filter='ServiceIntegrationTest|VectorSearchTest|TenantCacheIsolationTest|CachePolicyRegressionTest'
        env:
          FILTERABLE_TEST_DB: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: test_filterable
          DB_USERNAME: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: secret
          DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
          FILTERABLE_TEST_REDIS: '1'
